services:
  geth:
    image: ethereum/client-go:v1.17.0@sha256:40a8dc32e3eac888174a0f4aa1182f3a876e8e8ac22129de21ec3538ad0ac664
    container_name: ethbft-geth
    entrypoint: ["/start-geth.sh"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8545"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    ports:
      - "127.0.0.1:8545:8545"   # HTTP RPC
      - "127.0.0.1:8546:8546"   # WebSocket RPC
      - "127.0.0.1:30303:30303" # P2P (single-node demo)
    volumes:
      - ./jwt.hex:/jwt.hex
      - ./geth_data:/root/.ethereum
      - ./geth_data/genesis.json:/genesis.json
      - ./scripts/start-geth.sh:/start-geth.sh
    command:
      - --networkid=1337
      - --nodiscover
      - --datadir=/root/.ethereum
      - --verbosity=3
      - --http
      - --http.addr=0.0.0.0
      - --http.port=8545
      - --http.api=eth,net,web3,txpool
      - --http.corsdomain=http://localhost:5100,http://127.0.0.1:5100
      - --http.vhosts=localhost,127.0.0.1,geth,ethbft-geth
      - --ws
      - --ws.addr=0.0.0.0
      - --ws.port=8546
      - --ws.api=eth,net,web3,txpool
      - --ws.origins=http://localhost:5100,http://127.0.0.1:5100
      - --syncmode=full
      - --authrpc.addr=0.0.0.0
      - --authrpc.port=8551
      - --authrpc.jwtsecret=/jwt.hex
      - --authrpc.vhosts=geth,ethbft-geth,localhost
      - --metrics
      - --metrics.addr=0.0.0.0
      - --metrics.port=6060

  ethbft:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ethbft-app
    restart: unless-stopped
    depends_on:
      geth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/live"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    ports:
      - "127.0.0.1:8080:8080" # ABCI socket
      - "127.0.0.1:8081:8081" # Health check
      # Removed 8551 port mapping - only Geth should expose Engine API
    volumes:
      - ./config/docker-config.yaml:/app/config.yaml
      - ./jwt.hex:/app/jwt.hex
      - ethbft_data:/app/data
    environment:
      - ETHBFT_CONFIG=/app/config.yaml

  cometbft:
    image: cometbft/cometbft:v0.38.21@sha256:97201755bec7079c41d3ec8f0de3b55bc11f8b590046bc31dd616727d0fbb47f
    container_name: ethbft-cometbft
    restart: unless-stopped
    depends_on:
      ethbft:
        condition: service_healthy
    entrypoint: ["/start-cometbft.sh"]
    ports:
      - "127.0.0.1:26656:26656"
      - "127.0.0.1:26657:26657"
    volumes:
      - ./cometbft_home:/cometbft
      - ./scripts/start-cometbft.sh:/start-cometbft.sh

  explorer:
    image: alethio/ethereum-lite-explorer@sha256:1de833711ff9f3ed26987e701c1d12789bcfb1261ead87e1f088b8a0554f9944
    platform: linux/amd64
    container_name: ethbft-explorer
    restart: unless-stopped
    ports:
      - "127.0.0.1:5100:80"
    environment:
      - APP_NODE_URL=http://localhost:8545

  prometheus:
    image: prom/prometheus@sha256:3c42b892cf723fa54d2f262c37a0e1f80aa8c8ddb1da7b9b0df9455a35a7f893
    container_name: ethbft-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:19090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - --config.file=/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana@sha256:121a7a9ece6dc10b969f1f96eed64b4f07dfac0d0b8abc070f7cb83bbde86f63
    container_name: ethbft-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_PLUGINS_PREINSTALL_DISABLED=true
    depends_on:
      - prometheus

volumes:
  ethbft_data:
