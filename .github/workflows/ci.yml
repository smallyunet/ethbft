name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Rust Build, Lint, and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.91
        run: |
          rustup toolchain install 1.91.0 --profile minimal --component clippy,rustfmt
          rustup default 1.91.0
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --locked --all-targets
      - name: Build release binary
        run: cargo build --locked --release

  e2e-test:
    name: Docker Execution Path
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.91
        run: |
          rustup toolchain install 1.91.0 --profile minimal
          rustup default 1.91.0
      - name: Build Docker image
        run: docker compose build
      - name: Run E2E test
        env:
          ETHBFT_E2E: "1"
          ETHBFT_E2E_NO_BUILD: "1"
        run: cargo test --locked --test e2e -- --nocapture
