name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build and Unit Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.12'
        cache: true

    - name: Verify dependencies
      run: go mod verify

    - name: Build
      run: go build -v ./...

    - name: Run Tests
      run: go test -v ./...

    - name: Run Vet
      run: go vet ./...

    - name: Run Race Tests
      run: go test -race ./pkg/...

    - name: Scan Reachable Go Vulnerabilities
      run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  e2e-test:
    name: E2E Test
    runs-on: ubuntu-latest
    needs: build-and-test
    # Only run E2E on main branch pushes or PRs to main, to save resources/time on quick iterations if needed
    # For now, let's run it always to ensure stability.
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.12'
        cache: true

    - name: Build Docker Images
      run: docker compose build

    - name: Run E2E Tests
      env:
        ETHBFT_E2E: "1"
        ETHBFT_E2E_NO_BUILD: "1"
      run: go test -v -timeout 10m ./e2e/...
