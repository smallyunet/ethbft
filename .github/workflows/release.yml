name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and publish Linux release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.91
        run: |
          rustup toolchain install 1.91.0 --profile minimal
          rustup default 1.91.0
      - name: Test
        run: cargo test --locked --all-targets
      - name: Build release binary
        run: cargo build --locked --release --bin ethbft
      - name: Package artifact
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          install -Dm755 target/release/ethbft "dist/ethbft-${RELEASE_TAG}-x86_64-unknown-linux-gnu/ethbft"
          cp README.md LICENSE config/config.yaml "dist/ethbft-${RELEASE_TAG}-x86_64-unknown-linux-gnu/"
          tar -C dist -czf "dist/ethbft-${RELEASE_TAG}-x86_64-unknown-linux-gnu.tar.gz" "ethbft-${RELEASE_TAG}-x86_64-unknown-linux-gnu"
          sha256sum "dist/ethbft-${RELEASE_TAG}-x86_64-unknown-linux-gnu.tar.gz" > "dist/ethbft-${RELEASE_TAG}-x86_64-unknown-linux-gnu.tar.gz.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          awk -v heading="## ${RELEASE_TAG}" '
            index($0, heading) == 1 { capture=1; next }
            capture && /^## / { capture=0 }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "EthBFT $RELEASE_TAG" \
            --notes-file release-notes.md \
            "dist/ethbft-${RELEASE_TAG}-x86_64-unknown-linux-gnu.tar.gz" \
            "dist/ethbft-${RELEASE_TAG}-x86_64-unknown-linux-gnu.tar.gz.sha256"
